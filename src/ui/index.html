<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadona Autopilot — Mercadín 🦔</title>
    <meta name="description" content="Mercadín, tu asistente de compras inteligente de Mercadona. Chat conversacional con carrito en vivo.">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const API_BASE = "http://localhost:8000";

        const ALLERGEN_OPTIONS = [
            { value: "gluten", label: "Gluten", emoji: "🌾" },
            { value: "lactosa", label: "Lactosa", emoji: "🥛" },
            { value: "huevo", label: "Huevo", emoji: "🥚" },
            { value: "frutos_secos", label: "Frutos secos", emoji: "🥜" },
            { value: "crustáceos", label: "Crustáceos", emoji: "🦐" },
            { value: "pescado", label: "Pescado", emoji: "🐟" },
        ];
        const DIET_OPTIONS = [
            { value: "equilibrado", label: "Equilibrado" },
            { value: "vegetariano", label: "Vegetariano" },
            { value: "vegano", label: "Vegano" },
            { value: "alta proteína", label: "Alta proteína" },
            { value: "bajo en grasas", label: "Bajo en grasas" },
        ];

        function getCategoryEmoji(cat) {
            const m = { carne:'🥩', 'marisco y pescado':'🐟', pescado:'🐟', 'fruta y verdura':'🥬',
                'huevos, leche y mantequilla':'🥛', 'arroz, legumbres y pasta':'🍚',
                'aceite, especias y salsas':'🫒', 'panadería y pastelería':'🍞',
                'conservas, caldos y cremas':'🥫', 'postres y yogures':'🍨',
                'cereales y galletas':'🥣', congelados:'🧊', 'charcutería y quesos':'🧀',
                'cacao, café e infusiones':'☕', 'agua y refrescos':'🥤', zumos:'🧃',
                bodega:'🍷', aperitivos:'🥜', 'azúcar, caramelos y chocolate':'🍫',
                'pizzas y platos preparados':'🍕', bebé:'👶' };
            return m[(cat||'').toLowerCase()] || '🛒';
        }

        function formatMessage(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br/>');
        }

        // ═══════════════════════════════════════════════
        //  PROFILE MODAL
        // ═══════════════════════════════════════════════
        const ProfileModal = ({ isOpen, onClose, profile, onSave }) => {
            const [form, setForm] = useState({ name:'', people:2, allergens:[], diet:'equilibrado', monthly_budget:200, per_cart_budget:25, preferences:'' });
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                if (profile && isOpen) setForm({
                    name: profile.name||'', people: profile.people||2,
                    allergens: profile.allergens||[], diet: profile.diet||'equilibrado',
                    monthly_budget: profile.monthly_budget||200, per_cart_budget: profile.per_cart_budget||25,
                    preferences: profile.preferences||'',
                });
            }, [profile, isOpen]);

            const handleSave = async () => {
                setSaving(true);
                try {
                    const res = await fetch(`${API_BASE}/api/profile`, {
                        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form)
                    });
                    if (res.ok) { const d = await res.json(); onSave(d); onClose(); }
                } catch(e) { console.error(e); }
                finally { setSaving(false); }
            };

            if (!isOpen) return null;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-panel" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <div><h2>Mi Perfil</h2><p>Personaliza tu experiencia</p></div>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>
                        <div className="modal-body">
                            <div>
                                <label className="form-label">🏠 Nombre del hogar</label>
                                <input className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Ej: Familia García"/>
                            </div>
                            <div>
                                <label className="form-label">👥 Personas</label>
                                <div className="people-counter">
                                    <button className="people-btn" onClick={()=>setForm({...form,people:Math.max(1,form.people-1)})}>−</button>
                                    <span className="people-count">{form.people}</span>
                                    <button className="people-btn" onClick={()=>setForm({...form,people:Math.min(20,form.people+1)})}>+</button>
                                </div>
                            </div>
                            <div>
                                <label className="form-label">🚫 Alergias</label>
                                <div className="allergen-grid">
                                    {ALLERGEN_OPTIONS.map(o => (
                                        <button key={o.value} className={`allergen-btn ${form.allergens.includes(o.value)?'active':''}`}
                                            onClick={()=>setForm({...form, allergens: form.allergens.includes(o.value) ? form.allergens.filter(a=>a!==o.value) : [...form.allergens,o.value]})}>
                                            <span>{o.emoji}</span>{o.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="form-label">🥗 Dieta</label>
                                <div className="diet-grid">
                                    {DIET_OPTIONS.map(o => (
                                        <button key={o.value} className={`diet-btn ${form.diet===o.value?'active':''}`}
                                            onClick={()=>setForm({...form,diet:o.value})}>{o.label}</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="form-label">💰 Presupuesto por compra (€)</label>
                                <input className="form-input" type="number" min="5" max="500" step="5" value={form.per_cart_budget}
                                    onChange={e=>setForm({...form,per_cart_budget:parseFloat(e.target.value)||25})}/>
                            </div>
                            <div>
                                <label className="form-label">📅 Presupuesto mensual (€)</label>
                                <input className="form-input" type="number" min="50" max="5000" step="25" value={form.monthly_budget}
                                    onChange={e=>setForm({...form,monthly_budget:parseFloat(e.target.value)||200})}/>
                            </div>
                        </div>
                        <div className="modal-footer">
                            <button className="save-btn" onClick={handleSave} disabled={saving}>{saving?'Guardando...':'Guardar perfil'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ═══════════════════════════════════════════════
        //  LIVE CART COMPONENT
        // ═══════════════════════════════════════════════
        const LiveCart = ({ cart, total, budget, confirmed, onConfirm, agentLogs, highlightIds }) => {
            const [logsOpen, setLogsOpen] = useState(false);
            const pct = budget > 0 ? Math.min(100, (total/budget)*100) : 0;
            const barClass = pct > 90 ? 'over' : pct > 60 ? 'warn' : 'ok';

            return (
                <div className="cart-panel">
                    <div className="cart-header">
                        <h2>🛒 Carrito en Vivo {cart.length > 0 && <span className="cart-count">{cart.length}</span>}</h2>
                    </div>
                    <div className="cart-items">
                        {cart.length === 0 ? (
                            <div className="cart-empty">
                                <div className="cart-empty-icon">🛒</div>
                                <p>Tu carrito está vacío.<br/>Habla con Mercadín para llenarlo.</p>
                            </div>
                        ) : cart.map(p => (
                            <div key={p.id} className={`cart-item ${highlightIds.includes(p.id)?'entering highlight':''}`}>
                                <div className="cart-item-emoji">{getCategoryEmoji(p.category)}</div>
                                <div className="cart-item-info">
                                    <div className="cart-item-name" title={p.name}>{p.name}</div>
                                    <div className="cart-item-brand">{p.brand}</div>
                                </div>
                                <div className="cart-item-price">{p.price.toFixed(2)}€</div>
                            </div>
                        ))}
                    </div>

                    {agentLogs && agentLogs.length > 0 && (
                        <div className="agent-logs">
                            <button className="agent-logs-toggle" onClick={()=>setLogsOpen(!logsOpen)}>
                                {logsOpen ? '▼' : '▶'} Decisiones de agentes ({agentLogs.length})
                            </button>
                            {logsOpen && <div className="agent-logs-content">{agentLogs.map((l,i)=><div key={i}>{l}</div>)}</div>}
                        </div>
                    )}

                    {cart.length > 0 && (
                        <div className="cart-summary">
                            <div className="cart-total-row">
                                <span className="cart-total-label">Total</span>
                                <span className="cart-total-amount">{total.toFixed(2)}€</span>
                            </div>
                            <div className="budget-bar"><div className={`budget-bar-fill ${barClass}`} style={{width:`${pct}%`}}></div></div>
                            <div className="budget-text">{total.toFixed(2)}€ de {budget.toFixed(0)}€ presupuesto · Ahorro: {Math.max(0,budget-total).toFixed(2)}€</div>
                            <button className={`confirm-btn ${confirmed?'confirmed':''}`}
                                onClick={onConfirm} disabled={cart.length===0||confirmed}>
                                {confirmed ? '✓ Compra Confirmada' : 'Confirmar Compra'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // ═══════════════════════════════════════════════
        //  MAIN APP
        // ═══════════════════════════════════════════════
        const App = () => {
            const [messages, setMessages] = useState([]);
            const [cart, setCart] = useState([]);
            const [cartTotal, setCartTotal] = useState(0);
            const [budget, setBudget] = useState(25);
            const [sessionId, setSessionId] = useState(null);
            const [isTyping, setIsTyping] = useState(false);
            const [confirmed, setConfirmed] = useState(false);
            const [inputText, setInputText] = useState('');
            const [profile, setProfile] = useState(null);
            const [profileOpen, setProfileOpen] = useState(false);
            const [suggestions, setSuggestions] = useState([]);
            const [demoMode, setDemoMode] = useState(true);
            const [agentLogs, setAgentLogs] = useState([]);
            const [highlightIds, setHighlightIds] = useState([]);
            const [mobileCartOpen, setMobileCartOpen] = useState(false);
            const [connectionError, setConnectionError] = useState(false);

            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };
            useEffect(scrollToBottom, [messages, isTyping]);

            // ── Init: load profile + start chat ─────
            useEffect(() => {
                const init = async () => {
                    try {
                        // Load profile
                        const pRes = await fetch(`${API_BASE}/api/profile`);
                        if (pRes.ok) setProfile(await pRes.json());

                        // Start chat session
                        const cRes = await fetch(`${API_BASE}/api/chat/start`, { method: 'POST' });
                        if (cRes.ok) {
                            const data = await cRes.json();
                            setSessionId(data.session_id);
                            setDemoMode(data.demo_mode);
                            setBudget(data.profile_summary.per_cart_budget || 25);
                            setMessages([{ role:'assistant', content: data.greeting }]);
                            setSuggestions(data.suggestions || []);
                        }
                        setConnectionError(false);
                    } catch(e) {
                        console.error('Init error:', e);
                        setConnectionError(true);
                        setMessages([{
                            role: 'assistant',
                            content: '🦔 ¡Ups! No puedo conectar con el servidor. Asegúrate de que esté corriendo:\n\n`python -m uvicorn src.backend.main:app --port 8000`'
                        }]);
                    }
                };
                init();
            }, []);

            // ── Send message ────────────────────────
            const sendMessage = async (text) => {
                if (!text.trim() || !sessionId || confirmed) return;

                const userMsg = text.trim();
                setInputText('');
                setMessages(prev => [...prev, { role:'user', content: userMsg }]);
                setSuggestions([]);
                setIsTyping(true);

                try {
                    const res = await fetch(`${API_BASE}/api/chat/message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, message: userMsg }),
                    });

                    if (!res.ok) throw new Error(`Error ${res.status}`);
                    const data = await res.json();

                    setIsTyping(false);
                    setMessages(prev => [...prev, { role:'assistant', content: data.mercadin_message }]);

                    // Update cart
                    if (data.current_cart) {
                        setCart(data.current_cart);
                        setCartTotal(data.total);
                        setBudget(data.budget);

                        // Highlight new products
                        if (data.cart_delta && data.cart_delta.added.length > 0) {
                            const newIds = data.cart_delta.added.map(p => p.id);
                            setHighlightIds(newIds);
                            setTimeout(() => setHighlightIds([]), 2000);
                        }
                    }

                    if (data.agent_logs && data.agent_logs.length > 0) {
                        setAgentLogs(data.agent_logs);
                    }

                    // Handle confirmation
                    if (data.confirmed) {
                        handleConfirm();
                    }

                } catch(e) {
                    setIsTyping(false);
                    setMessages(prev => [...prev, {
                        role:'assistant',
                        content: '🦔 Perdona, ha habido un error de conexión. ¿Puedes intentarlo de nuevo?'
                    }]);
                }
            };

            // ── Confirm purchase ────────────────────
            const handleConfirm = async () => {
                if (!sessionId || confirmed) return;
                try {
                    const res = await fetch(`${API_BASE}/api/chat/confirm`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId }),
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setConfirmed(true);
                        setMessages(prev => [...prev, { role:'assistant', content: data.message }]);
                        // Refresh profile
                        const pRes = await fetch(`${API_BASE}/api/profile`);
                        if (pRes.ok) setProfile(await pRes.json());
                    }
                } catch(e) { console.error(e); }
            };

            // ── New session ─────────────────────────
            const resetSession = async () => {
                setMessages([]); setCart([]); setCartTotal(0); setConfirmed(false);
                setAgentLogs([]); setSuggestions([]); setHighlightIds([]);
                setIsTyping(true);
                try {
                    const res = await fetch(`${API_BASE}/api/chat/start`, { method: 'POST' });
                    if (res.ok) {
                        const data = await res.json();
                        setSessionId(data.session_id);
                        setBudget(data.profile_summary.per_cart_budget || 25);
                        setMessages([{ role:'assistant', content: data.greeting }]);
                        setSuggestions(data.suggestions || []);
                    }
                } catch(e) { console.error(e); }
                setIsTyping(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(inputText);
                }
            };

            return (
                <div className="app-container">
                    {/* ═══ HEADER ═══ */}
                    <header className="app-header">
                        <img src="assets/logo.png" alt="Mercadona" className="logo" onClick={resetSession} title="Nueva conversación"/>
                        <div className="header-right">
                            <div className={`ia-badge ${demoMode ? 'demo' : 'connected'}`}>
                                <span className="dot"></span>
                                {demoMode ? 'Modo Demo' : 'Mercadín IA'}
                            </div>
                            <button className="profile-btn" onClick={() => setProfileOpen(true)}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                {profile?.name || 'Mi perfil'}
                            </button>
                        </div>
                    </header>

                    {/* ═══ MAIN SPLIT ═══ */}
                    <div className="main-content">
                        {/* ─── CHAT PANEL ─── */}
                        <div className="chat-panel">
                            <div className="chat-messages">
                                {messages.map((msg, i) => (
                                    <div key={i} className={`message ${msg.role}`}>
                                        <div className="message-avatar">
                                            {msg.role === 'assistant' ? '🦔' : '👤'}
                                        </div>
                                        <div className="message-content"
                                            dangerouslySetInnerHTML={{ __html: formatMessage(msg.content) }}/>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="typing-indicator">
                                        <div className="message-avatar" style={{background:'var(--merca-light)'}}>🦔</div>
                                        <div className="typing-dots">
                                            <span></span><span></span><span></span>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef}/>
                            </div>

                            {suggestions.length > 0 && !confirmed && (
                                <div className="suggestions">
                                    {suggestions.map((s, i) => (
                                        <button key={i} className="suggestion-btn" onClick={() => sendMessage(s)}>{s}</button>
                                    ))}
                                </div>
                            )}

                            <div className="chat-input-area">
                                <div className="chat-input-wrapper">
                                    <textarea className="chat-input" ref={inputRef}
                                        rows="1" placeholder={confirmed ? 'Compra confirmada ✓' : 'Escribe a Mercadín...'}
                                        value={inputText} onChange={e => setInputText(e.target.value)}
                                        onKeyDown={handleKeyDown} disabled={confirmed || !sessionId}/>
                                    <button className="send-btn" onClick={() => sendMessage(inputText)}
                                        disabled={!inputText.trim() || confirmed || !sessionId}>
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* ─── CART PANEL (desktop) ─── */}
                        <LiveCart cart={cart} total={cartTotal} budget={budget}
                            confirmed={confirmed} onConfirm={handleConfirm}
                            agentLogs={agentLogs} highlightIds={highlightIds}/>
                    </div>

                    {/* ═══ MOBILE CART ═══ */}
                    {cart.length > 0 && (
                        <div className="mobile-cart-pill" onClick={() => setMobileCartOpen(true)}>
                            🛒 {cartTotal.toFixed(2)}€ <span className="pill-count">{cart.length}</span>
                        </div>
                    )}
                    {mobileCartOpen && (
                        <div className="mobile-cart-overlay open" onClick={() => setMobileCartOpen(false)}>
                            <div className="mobile-cart-sheet" onClick={e => e.stopPropagation()}>
                                <div className="sheet-handle"></div>
                                <LiveCart cart={cart} total={cartTotal} budget={budget}
                                    confirmed={confirmed} onConfirm={handleConfirm}
                                    agentLogs={agentLogs} highlightIds={highlightIds}/>
                            </div>
                        </div>
                    )}

                    {/* ═══ PROFILE MODAL ═══ */}
                    <ProfileModal isOpen={profileOpen} onClose={() => setProfileOpen(false)}
                        profile={profile} onSave={(p) => { setProfile(p); resetSession(); }}/>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
